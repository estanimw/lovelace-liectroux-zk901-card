name: 'Build'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: liectroux-zk901-map-card
          path: dist/liectroux-zk901-map-card.js
          if-no-files-found: error
