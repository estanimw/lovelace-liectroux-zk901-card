name: Release

on:
  release:
    types: [published]

jobs:
  release:
    permissions:
      contents: write
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Test Python client and packaging
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build the file
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm ci
          npm version --git-tag-version=false --commit-hooks=false --allow-same-version "$RELEASE_TAG"
          npm run package

      - name: Upload build result to release
        uses: svenstaro/upload-release-action@v2

        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
